site_name: CUBRID Lab
site_url: https://cubrid-lab.github.io/
site_description: >-
  Open-source client ecosystem for CUBRID — mature Python packages
  (pycubrid, sqlalchemy-cubrid, cookbook, MCP server) plus Rust, Go, and
  TypeScript drivers in active development.
repo_url: https://github.com/cubrid-lab/cubrid-lab.github.io
repo_name: cubrid-lab/cubrid-lab.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Packages: packages.md
  - Documentation:
      - Overview: documentation.md
      - Python:
          - pycubrid: https://cubrid-lab.github.io/pycubrid/
          - sqlalchemy-cubrid: https://cubrid-lab.github.io/sqlalchemy-cubrid/
          - cubrid-cookbook-python: https://cubrid-lab.github.io/cubrid-cookbook-python/
          - cubrid-mcp-server: https://cubrid-lab.github.io/cubrid-mcp-server/
      - In progress:
          - Rust packages: https://cubrid-lab.github.io/packages/#rust-in-progress
          - Go packages: https://cubrid-lab.github.io/packages/#go-in-progress
          - TypeScript packages: https://cubrid-lab.github.io/packages/#typescript-in-progress
  - Get Started: get-started.md
  - Roadmap: roadmap.md
  - Community: community.md
  - About: about.md
